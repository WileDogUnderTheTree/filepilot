[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filepilot"
version = "0.2.0"
description = "基于 JSON 规则的本地文件整理 CLI 工具"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
filepilot = "filepilot.cli:main"

[tool.setuptools]
packages = ["filepilot"]
